[test]
name = "ppu_may_trap_rsx_window"

# A hardware probe: a dcbz and a misaligned lwz inside RSX local memory
# once libgcm has brought up an RSX context. Either may end the process,
# so each is named by a progress record before it runs. The console
# capture is the answer; no emulator runs it.

[observe]
# 39 big-endian u64 (312 bytes): DONE or PROG, the step a progress record
# names, rsxInit rc, the local memory address, the dcbz EA, the lwz EA,
# the lwz result, then the 256 bytes at local memory after the dcbz.
memory_regions = [
  { name = "result", addr = 0, size = 312 },
]

[expect]
outcome = "completed"

[ps3]
# The dcbz stops the process and the title never returns to the XMB, so
# the runner keeps no capture. The same reason is the test's row in
# tests/micro/ps3_gaps.tsv.
portable = false
not_portable_reason = "the dcbz at RSX local memory + 0x40 stops the game process after the progress record that names it; the title hangs until webMAN's exit clears it"
