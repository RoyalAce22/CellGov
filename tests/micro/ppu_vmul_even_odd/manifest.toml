[test]
name = "ppu_vmul_even_odd"

# A hardware probe of the eight even and odd vector multiplies,
# signed and unsigned, on bytes and half words, over 0, 1, all ones,
# both sides of the sign boundary and arbitrary values per lane.
# cases.tsv names each case. The console capture is the answer.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case (8 cases).
memory_regions = [
  { name = "result", addr = 0, size = 1040 },
]

[expect]
outcome = "completed"
