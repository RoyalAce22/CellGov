[test]
name = "lv2_ppu_thread_start_edges"

# A hardware probe: the sys_ppu_thread_start answers lv2_ppu_thread_answers
# left open, and the answers on a created thread that has not started.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u32 words at the offsets ppu/main.c lists: 80 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 80 },
]

[expect]
outcome = "completed"
