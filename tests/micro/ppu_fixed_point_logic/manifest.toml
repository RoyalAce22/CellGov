[test]
name = "ppu_fixed_point_logic"

# A hardware probe of the fixed-point logical and compare instructions at their operand boundaries.
# cases.tsv lists the 920 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 117776 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
