[test]
name = "ppu_fp_divsqrt_single_bits"

# A hardware probe of fdivs and fsqrts on double operands inside the
# single exponent range that carry fraction bits below single precision:
# whether the result rounds the exact quotient or root of the full double
# operands once, or of operands first cut to single. The console capture
# is the answer; no emulator runs it.

[observe]
# Big-endian u32 words, as ppu/main.c lists: 3 header words (failed
# step, its code, case count), then 11 words per case (operation, FPSCR
# before, FRA, FRB, FRC and FRT as high/low pairs, FPSCR after): 31
# cases, 344 words, 1376 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 1376 },
]

[expect]
outcome = "completed"
