[test]
name = "lv2_mmapper_unmap"

# A hardware probe: the mmapper unmap answers a game process gets, and the free answers that depend on what is still mapped.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 272 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 272 },
]

[expect]
outcome = "completed"
