[test]
name = "ppu_issue_divide_overflow"

# A hardware probe of what a signed divide costs on its overflow cases:
# eight timed loops of eight dependent divides (an addi control, divw
# and divd of the most negative value by -1, by 1 and by 0, and divw of
# the most positive word by -1). The console capture is the answer;
# ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 192 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 192 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 90000
