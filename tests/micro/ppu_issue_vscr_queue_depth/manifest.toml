[test]
name = "ppu_issue_vscr_queue_depth"

# A hardware probe of how many vector instructions an mtvscr fence holds
# before IS2 stalls the fixed-point work after them, and whether a vector
# or FP load the fence holds takes the load-hit-store recycle of a store
# before it, timed with mftb. The console capture is the answer;
# ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 184 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 184 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
