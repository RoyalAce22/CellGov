[test]
name = "ppu_issue_mffs_align"

# A hardware probe of how the 8-byte slot of an mffs and an fadd sets the
# wait between them: the ppu_issue_mffs_gap loops placed 4 bytes past a
# 32-byte boundary, and loops of an mffs and li alone at both places,
# timed with mftb. The console capture is the answer; ppu/main.c's
# header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 536 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 536 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
