[test]
name = "spu_dma_list"

[rpcs3]
binary = "build/spu_dma_list.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
# 16-byte header (status + stall-status word + pad) + 48 gathered bytes
memory_regions = [
  { name = "header", addr = 0, size = 8 },
  { name = "gathered", addr = 16, size = 48 },
]

[expect]
outcome = "completed"
