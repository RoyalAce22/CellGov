[test]
name = "ppu_issue_stall_kinds"

# A hardware probe of how much of a sibling's stall each kind of
# instruction waits: loops of addi, a hit, a store, a store and its
# reload, and an mtvscr with a vaddubm, each with 0, 2, 4 or 8 addi,
# alone and beside a sibling of dependent fdiv. The console capture is
# the answer; ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 2008 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 2008 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 180000
