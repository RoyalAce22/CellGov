[test]
name = "ppu_issue_shared"

# A hardware probe of what a sibling PPU thread's long-running
# instructions cost the other PPE hardware thread: five timed chains
# (dependent add, mulli and fadd, independent addi, an L1 ld chase),
# alone and beside a sibling running independent addi, dependent and
# independent divd, divw, mulld, fdiv, fsqrt, or microcoded lha. The
# console capture is the answer; ppu/main.c's header lists the phases
# and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 1920 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 1920 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 90000
