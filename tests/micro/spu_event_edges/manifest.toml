[test]
name = "spu_event_edges"

# A hardware probe: whether the Qv and Sn events follow the edge of
# their channel counts. It reads the event count at a thread's start
# with Qv and every other source but Tm enabled, stalls a second list
# while the first list's stall status is unread and again after it was
# read, and runs one get that never fills the command queue. The console
# capture is the answer; the CellGov gate compares the events CellGov
# raises against it.

[observe]
# Four 16-byte phase records, then the failed step, the SPU thread
# group's exit cause and status, and a zero word: 80 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 80 },
]

[expect]
outcome = "completed"

[ps3]
files = ["spu_main.elf"]
