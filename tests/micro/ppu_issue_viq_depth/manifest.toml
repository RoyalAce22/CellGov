[test]
name = "ppu_issue_viq_depth"

# A hardware probe of how many dependent fdiv a sibling can leave in the
# VSU issue queue before its stall reaches the shared issue stage:
# sixteen independent addi timed beside a sibling of N dependent fdiv and
# then 256 independent addi each round, N from 0 to 16. The console
# capture is the answer; ppu/main.c's header lists the phases and the
# payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 4088 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 4088 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
