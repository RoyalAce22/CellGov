[test]
name = "ppu_int_misaligned"

# A hardware probe of the integer loads and stores at misaligned addresses.
# cases.tsv lists the 208 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 26640 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
