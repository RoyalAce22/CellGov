[test]
name = "ppu_vmx_int_arith"

# A hardware probe of the vector integer add, subtract, average,
# maximum, minimum, multiply and sum instructions.
# cases.tsv lists the 356 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 45584 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
