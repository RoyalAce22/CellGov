[test]
name = "ppu_fixed_point_trap_quiet"

# A hardware probe of the trap instructions on conditions that do not hold.
# cases.tsv lists the 122 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 15632 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
