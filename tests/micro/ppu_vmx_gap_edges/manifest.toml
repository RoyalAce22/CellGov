[test]
name = "ppu_vmx_gap_edges"

# A hardware probe of the VMX cases the earlier vector probes left out:
# vsldoi with shift 0, vsrw and vsraw with a count of 31 in every lane,
# the four float compares with Rc = 0 from a seeded CR (NaN operands
# under NJ = 1, mixed results under NJ = 0), and the VSCR read back after
# vaddfp, vsubfp, vmaddfp, vnmsubfp, vmaxfp, vminfp and vrfin, each with
# NJ set alone or with SAT set first. cases.tsv names each case. The
# console capture is the answer.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case (18 cases).
memory_regions = [
  { name = "result", addr = 0, size = 2320 },
]

[expect]
outcome = "completed"
