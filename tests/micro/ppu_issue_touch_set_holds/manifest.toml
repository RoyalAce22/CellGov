[test]
name = "ppu_issue_touch_set_holds"

# A hardware probe of how long a load that misses the L1 and an ldarx
# hold their L1 set, and of how long a load that waits for a set that
# touch reloads hold holds the instructions after it, timed with mftb.
# The console capture is the answer; ppu/main.c's header lists the loops
# and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 160 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 160 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
