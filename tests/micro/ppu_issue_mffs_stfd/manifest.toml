[test]
name = "ppu_issue_mffs_stfd"

# A hardware probe of how far an stfd sits from an mffs, in li after it
# or right before it, sets the wait of the next mffs, with each loop on a
# 32-byte boundary and 4 bytes past one, timed with mftb. The console
# capture is the answer; ppu/main.c's header lists the loops and the
# payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 344 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 344 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
