[test]
name = "ppu_issue_mfxer"

# A hardware probe of what an mfxer costs at issue, timed with mftb, alone
# and beside fixed-point work, with mtxer, a carry-writing addic and mfcr
# beside it. The console capture is the answer; ppu/main.c's header lists
# the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 184 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 184 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
