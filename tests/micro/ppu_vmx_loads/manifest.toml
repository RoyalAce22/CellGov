[test]
name = "ppu_vmx_loads"

# A hardware probe of the vector loads at each address in a quadword.
# cases.tsv lists the 180 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 23056 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
