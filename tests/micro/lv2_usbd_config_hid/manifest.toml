[test]
name = "lv2_usbd_config_hid"

# A hardware probe: the read-only usbd, sys_config and hid answers a game process gets.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 448 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 448 },
]

[expect]
outcome = "completed"
