[test]
name = "ppu_issue_units"

# A hardware probe of whether a sibling PPU thread's stall reaches the
# other PPE hardware thread through the issue point or the VSU issue
# queue: seven timed chains (independent addi, dependent add, dependent
# and independent fadd, an L1 ld chase, addi and fadd interleaved, and
# dependent fadd with an independent addi after each), alone and beside
# a sibling running dependent divd, dependent or independent fdiv,
# microcoded lha, dependent fadd, or dependent mulld. The console
# capture is the answer; ppu/main.c's header lists the phases and the
# payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 1984 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 1984 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
