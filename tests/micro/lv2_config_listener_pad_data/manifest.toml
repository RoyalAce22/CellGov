[test]
name = "lv2_config_listener_pad_data"

# A hardware probe: whether a game process may register a pad-manager config listener with the 26-byte buffer vsh sends.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 432 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 432 },
]

[expect]
outcome = "completed"
