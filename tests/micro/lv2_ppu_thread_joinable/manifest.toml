[test]
name = "lv2_ppu_thread_joinable"

# A hardware probe: what the JOINABLE flag of _sys_ppu_thread_create
# changes for a join, and whether a thread created without it is still
# found after it exits. The console capture is the answer; no emulator
# runs it.

[observe]
# Big-endian u32 words at the offsets ppu/main.c lists: 64 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 64 },
]

[expect]
outcome = "completed"
