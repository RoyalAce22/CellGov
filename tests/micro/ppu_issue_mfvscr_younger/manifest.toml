[test]
name = "ppu_issue_mfvscr_younger"

# A hardware probe of when the instructions younger than an mfvscr issue,
# timed with mftb over runs of li to one register and to eight registers,
# vector ops, and a store after them. The console capture is the answer;
# ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 248 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 248 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
