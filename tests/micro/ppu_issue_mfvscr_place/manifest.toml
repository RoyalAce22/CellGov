[test]
name = "ppu_issue_mfvscr_place"

# A hardware probe of where in a 128-byte line an mfvscr, li and store
# loop starts, and of how many stores end it, timed with mftb. The
# console capture is the answer; ppu/main.c's header lists the loops and
# the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 280 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 280 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
