[test]
name = "lv2_config_event_read"

# A hardware probe: the buffer sizes sys_config_get_service_event accepts for a pad-manager event.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 304 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 304 },
]

[expect]
outcome = "completed"
