[test]
name = "lv2_prx_load_cycle"

# A hardware probe: what the PRX load, start, stop and unload calls
# answer for a firmware path that does not exist, for the stop
# handshake's report phase sent out of order to a started module, and
# for three modules that export one library. Every module it loads it
# stops and unloads. The console capture is the answer; no emulator
# runs it.

[observe]
# 24 big-endian u64, one per step in the order ppu/main.c lists: 192
# bytes.
memory_regions = [
  { name = "result", addr = 0, size = 192 },
]

[expect]
outcome = "completed"
