[test]
name = "lv2_prx_module_list"

# A hardware probe: how _sys_prx_get_module_list reads its option
# struct for each flag, declared size and fill of the words no caller
# names. Nothing is loaded or created. The console capture is the
# answer; no emulator runs it.

[observe]
# per case, 112 bytes: u64 r3, the 0x28-byte struct after the call,
# then idlist slots 0-15 as u32. The header of ppu/main.c names every
# case.
memory_regions = [
  { name = "result", addr = 0, size = 672 },
]

[expect]
outcome = "completed"
