[test]
name = "ppu_issue_fp_store_drain"

# A hardware probe of whether a sync, lwsync, isync, mffs, mfvscr or sc
# waits longer after a floating-point store than after a fixed-point
# store, timed with mftb against each drain alone. The console capture is
# the answer; ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 376 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 376 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
