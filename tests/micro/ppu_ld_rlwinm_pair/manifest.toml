[test]
name = "ppu_ld_rlwinm_pair"

# A hardware probe: the loaded register, the rotate's target and CR an
# adjacent "ld rT,d(r1) ; rlwinm rA,rS,SH,MB,ME" leaves, for a rotate of
# the loaded value, a wrapping mask, recording rotates with a negative and
# a zero result, the slwi, srwi and clrlwi forms, a rotate into the load's
# own target, a rotate of another register, and a branch into the rotate.
# The console capture is the answer; no emulator runs it.

[observe]
# 31 big-endian u32 words, as ppu/main.c lists: 124 bytes.
#   0 failed step, 1 its return code; each register as a high word and
#   a low word:
#   2-3 r6, 4-5 r7, 6 CR after "ld 6,-8(1) ; rlwinm. 7,6,8,0,23";
#   7-8 r7 after "ld 6,-8(1) ; rlwinm 7,6,8,24,7";
#   9-10 r7, 11 CR after "ld 6,-8(1) ; rlwinm. 7,6,0,1,0";
#   12-13 r7, 14 CR after "ld 6,-8(1) ; rlwinm. 7,6,0,0,7" with XER[SO] = 1;
#   15-16 r7 after slwi 7,6,3; 17-18 r7 after srwi 7,6,3;
#   19-20 r7 after clrlwi 7,6,3;
#   21-22 r6 after "ld 6,-8(1) ; rlwinm 6,6,16,0,31";
#   23-24 r6, 25-26 r7 after "ld 6,-8(1) ; rlwinm 7,5,4,0,27";
#   27-28 r6, 29-30 r7 after a branch into the rotate.
memory_regions = [
  { name = "result", addr = 0, size = 124 },
]

[expect]
outcome = "completed"
