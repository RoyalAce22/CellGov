[test]
name = "ppu_issue_fdiv_chain"

# A hardware probe of why a dependent chain and independent addi pairs
# pay differently beside a lower-priority sibling of back-to-back fdiv:
# four loops timed beside the sibling as an assembly loop and as a C loop
# that reads the time base between rounds, each run kept with the
# sibling's rounds over it. The console capture is the answer;
# ppu/main.c's header lists the phases and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 2560 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 2560 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
