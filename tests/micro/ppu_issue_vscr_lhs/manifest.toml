[test]
name = "ppu_issue_vscr_lhs"

# A hardware probe of what a load that hits a store in the store queue
# costs by load and store form, and how an mtvscr before the store
# changes it, timed with mftb. The console capture is the answer;
# ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 184 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 184 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
