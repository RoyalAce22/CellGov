[test]
name = "ppu_issue_mffs_far"

# A hardware probe of an fadd or an stfd 20 to 48 li from an mffs, before
# or after it, and of the li alone, timed with mftb. The console capture
# is the answer; ppu/main.c's header lists the loops and the payload
# layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 280 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 280 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
