[test]
name = "lv2_mmapper_map"

# A hardware probe: the mmapper map, search and unmap answers a game process gets.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 384 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 384 },
]

[expect]
outcome = "completed"
