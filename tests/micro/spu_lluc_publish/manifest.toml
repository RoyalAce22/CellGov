[test]
name = "spu_lluc_publish"

[rpcs3]
binary = "build/spu_lluc_publish.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
# the holder's header (status, getllar status, putllc status, pad),
# the line's first bytes after its putllc, and the publisher's putlluc
# status
memory_regions = [
  { name = "holder", addr = 0, size = 16 },
  { name = "line", addr = 16, size = 16 },
  { name = "publisher", addr = 32, size = 16 },
]

[expect]
outcome = "completed"

# CellGov title manifest. Build + run:
#   docker run --rm #     -v "$(pwd)/tests/micro/spu_lluc_publish:/src" #     -v "$(pwd)/tests/micro/common:/common" #     -e COMMON=/common ps3dev bash /src/build.sh
#
#   cargo run --release -p cellgov_cli -- boot run #     --title-manifest tests/micro/spu_lluc_publish/manifest.toml #     --max-steps 1000000

[cellgov.title]
short_name = "spullucpub"
display_name = "CellGov SPU lock-line publish microtest"
eboot_candidates = ["spu_lluc_publish.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"
