[test]
name = "ppu_lv2_allocate_flags"

# A hardware probe of the round trip of sys_memory_allocate when its
# flags name no page size, beside the same sizes with the 1 MiB page
# flag, and of the answer to a size whose upper word is not zero, each
# call timed alone with mftb over 16 rounds. The console capture is the
# answer; ppu/main.c's header lists the calls and the payload layout.

[observe]
# Big-endian u64 words, then u32 samples, at the offsets ppu/main.c
# lists: 1216 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 1216 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
