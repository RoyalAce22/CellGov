[test]
name = "ppu_fp_unary"

# A hardware probe of the scalar floating-point square roots, estimates, select, moves, round, conversions and compares.
# cases.tsv lists the 334 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 42768 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
