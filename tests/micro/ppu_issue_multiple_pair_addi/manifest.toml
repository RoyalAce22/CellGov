[test]
name = "ppu_issue_multiple_pair_addi"

# A hardware probe of how independent addi before, between or after a
# store multiple and a load multiple of the same bytes change the pair's
# cost, timed with mftb. The console capture is the answer; ppu/main.c's
# header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 216 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 216 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
