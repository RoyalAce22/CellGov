[test]
name = "lv2_memory_free_container"

# A hardware probe: the memory allocate, free and container answers a game process gets.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 448 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 448 },
]

[expect]
outcome = "completed"
