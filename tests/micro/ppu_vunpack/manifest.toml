[test]
name = "ppu_vunpack"

# A hardware probe of vupkhsb, vupklsb, vupkhsh, vupklsh, vupkhpx and
# vupklpx over 0, 1, all ones, the sign bit, the largest positive
# value and arbitrary values per element, with a distinct value in
# each half of vB. cases.tsv names each case. The console capture is
# the answer.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case (6 cases).
memory_regions = [
  { name = "result", addr = 0, size = 784 },
]

[expect]
outcome = "completed"
