[test]
name = "ppu_issue_priority"

# A hardware probe of which of two PPU threads gives way at the shared
# issue point: three timed chains on the main thread (dependent add,
# dependent fadd, an L1 ld chase), alone and beside a sibling of
# independent addi created at a lower, the same and a higher LV2
# priority than the main thread's. The sibling counts its rounds in
# memory and reads no time base. The console capture is the answer;
# ppu/main.c's header lists the phases and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 1536 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 1536 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
