[test]
name = "ppu_vmx_float_arith"

# A hardware probe of the vector floating-point arithmetic, compare,
# convert, round and estimate instructions.
# cases.tsv lists the 570 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 72976 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
