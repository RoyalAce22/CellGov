[test]
name = "ppu_issue_chain"

# A hardware probe of where a chain of dependent fixed-point instructions
# loses the fraction of a cycle the PPU issue model does not give it:
# twelve loops, each timed with mftb. Dependent add and mulli chains of
# several lengths an iteration, a dependent mullw chain, 256-long runs
# of each between branches, and two chains beside a sibling thread that
# holds the other hardware thread with a divd chain. The console capture
# is the answer; ppu/main.c's header lists the loops and the payload
# layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 256 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 256 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
