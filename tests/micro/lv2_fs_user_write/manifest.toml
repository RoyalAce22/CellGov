[test]
name = "lv2_fs_user_write"

# A hardware probe: which directories a process without root permission
# (control_flags1 0, as a retail title is signed) may create a file in.
# The console capture is the answer; no emulator runs it.

[observe]
# 3 big-endian u64 words, in the order ppu/main.c lists: 24 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 24 },
]

[expect]
outcome = "completed"

[ps3]
# A process without root permission may not create files in /dev_hdd0/tmp.
result_in_usrdir = true
