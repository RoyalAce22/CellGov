[test]
name = "ppu_issue_stmw_barrier_words"

# A hardware probe of what an lwsync and a sync cost after a store
# multiple of 1 to 8 words, against the same barrier after an std, timed
# with mftb. The console capture is the answer; ppu/main.c's header lists
# the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 248 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 248 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
