[test]
name = "spu_signal_notify"

[rpcs3]
binary = "build/spu_signal_notify.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
# the status, the configuration read back and the two refusals; the
# signal counts and registers the SPU read; the counts after the reads
# and the two configuration refusals
memory_regions = [
  { name = "config", addr = 0, size = 16 },
  { name = "signals", addr = 16, size = 16 },
  { name = "after", addr = 32, size = 16 },
]

[expect]
outcome = "completed"

# CellGov title manifest. Build + run:
#   docker run --rm #     -v "$(pwd)/tests/micro/spu_signal_notify:/src" #     -v "$(pwd)/tests/micro/common:/common" #     -e COMMON=/common ps3dev bash /src/build.sh
#
#   cargo run --release -p cellgov_cli -- boot run #     --title-manifest tests/micro/spu_signal_notify/manifest.toml #     --max-steps 1000000

[cellgov.title]
short_name = "spusignal"
display_name = "CellGov SPU signal notification microtest"
eboot_candidates = ["spu_signal_notify.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"
