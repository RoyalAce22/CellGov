[test]
name = "ppu_issue_stall_release"

# A hardware probe of whether a sibling's stalls delay a store's release
# from the store queue and a divide's release of the FXU: a store and a
# reload of its bytes, a store and a load of another line, back-to-back
# independent divd, and divd or addi with four independent loads after
# each, alone and beside a sibling of dependent fdiv. The console capture
# is the answer; ppu/main.c's header lists the loops and the payload
# layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 752 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 752 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
