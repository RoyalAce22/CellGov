[test]
name = "elf_no_process_param"

# elf_process_param linked without the process-param record: the SDK
# version sys_process_get_sdk_version answers for a process that has
# none, and the same function-descriptor reads. The PPU program's header
# comment has the payload layout.

[observe]
memory_regions = [
  { name = "result", addr = 0, size = 128 },
]

[expect]
outcome = "completed"
