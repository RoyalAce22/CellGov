[test]
name = "rsx_semaphore_post"

# Structural microtest. The PPU brings up an RSX context through
# libgcm, writes an NV4097_GET_REPORT method into the command buffer,
# flushes it, and polls the report record libgcm names for a non-zero
# timestamp. Exercises the SetReport path end-to-end.

[rpcs3]
binary = "build/rsx_semaphore_post.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
memory_regions = [
  { name = "result", addr = 0, size = 16 },
]

[expect]
outcome = "completed"

[cellgov.title]
short_name = "rxsem"
display_name = "CellGov RSX semaphore-post microtest"
eboot_candidates = ["rsx_semaphore_post.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"

[cellgov.rsx]
# The RSX region writable, the runtime's writeback mirror on, and the
# FIFO consumer draining what libgcm puts in the command buffer.
mirror = true
consume = true

[ps3]
# Bytes the design table leaves free (Any): a hardware run may vary them.
volatile = [
  { region = "result", offset = 4, size = 8, reason = "the timer and the poll count depend on when the report lands" },
]
