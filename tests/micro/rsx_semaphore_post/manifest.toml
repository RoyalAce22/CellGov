[test]
name = "rsx_semaphore_post"

# Structural microtest. A PPU thread writes an NV4097_GET_REPORT
# method to the FIFO, advances put, and polls the target report
# slot for a non-zero value (timestamp). Exercises the SetReport
# path end-to-end.

[rpcs3]
binary = "build/rsx_semaphore_post.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
memory_regions = [
  { name = "result", addr = 0, size = 16 },
]

[expect]
outcome = "completed"

[cellgov.title]
short_name = "rxsem"
display_name = "CellGov RSX semaphore-post microtest"
eboot_candidates = ["rsx_semaphore_post.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"

[cellgov.rsx]
mirror = true
consume = true
# The guest seeds cursor.get by storing to the MMIO GET slot, and
# only the FIFO consumer reconciles cursor.get from MMIO
# (mirror_rsx_control_register_writes mirrors PUT and REF, not GET).
# Without this the drain walks from get = 0 and never reaches the
# commands this test wrote.
