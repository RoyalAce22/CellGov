[test]
name = "ppu_issue_vscr_smt_lsu"

# A hardware probe of whether one PPU thread's mtvscr stalls the load and
# store work of the sibling thread beside it: three chains (independent
# lwz, lvx and stw on one line), alone and beside a sibling running
# back-to-back mtvscr or independent addi, in a loop that counts its
# rounds in memory and reads no time base. The console capture is the
# answer; ppu/main.c's header lists the phases and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 640 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 640 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
