[test]
name = "rsx_label_write_poll"

# Structural microtest. The PPU brings up an RSX context through
# libgcm (rsxInit over a 1 MiB-page host area), writes an
# NV406E_SEMAPHORE_OFFSET + RELEASE pair for a user label into the
# command buffer, flushes it, and polls the label for the released
# value. Exercises the label-write path the way a game drives it.

[rpcs3]
binary = "build/rsx_label_write_poll.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
# TestResult: status + label_value + expected + spin_iters
memory_regions = [
  { name = "result", addr = 0, size = 16 },
]

[expect]
outcome = "completed"

# CellGov title manifest. Consumed by `cellgov boot run
# --title-manifest <this file>`.
#
# Usage:
#   1. Build the ELF (requires the ps3dev image; build it once with
#      `docker build -t ps3dev tests/micro/toolchain`):
#        docker run --rm \
#          -v "$(pwd)/tests/micro/rsx_label_write_poll:/src" \
#          -v "$(pwd)/tests/micro/common:/common" \
#          -e COMMON=/common ps3dev bash /src/build.sh
#
#   2. Run (the program imports libgcm, so the boot needs the firmware
#      and a build that decrypts its modules):
#        cargo run --release --features decrypt -p cellgov_cli -- \
#          boot run --fw 4.93 --title-manifest \
# tests/micro/rsx_label_write_poll/manifest.toml --max-steps 1000000
#
# Expected TTY payload (CGOV magic + 16 bytes):
#   status=0x00000000 label_value=0xCAFEBABE
#   expected=0xCAFEBABE spin_iters=<small>

[cellgov.title]
short_name = "rxlbl"
display_name = "CellGov RSX label-write-poll microtest"
eboot_candidates = ["rsx_label_write_poll.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"

[cellgov.rsx]
# The RSX region writable, the runtime's writeback mirror on, and the
# FIFO consumer draining what libgcm puts in the command buffer.
mirror = true
consume = true

[ps3]
# Bytes the design table leaves free (Any): a hardware run may vary them.
volatile = [
  { region = "result", offset = 12, size = 4, reason = "the poll count depends on when the label lands" },
]
