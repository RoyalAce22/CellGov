[test]
name = "ppu_lv2_call_live_errors"

# A hardware probe of the LV2 round trip of a call that finds its object
# and then refuses: eight loops of one syscall each, timed with mftb. The
# probe creates one semaphore, one mutex and one event flag and destroys
# them before it writes its result. ppu/main.c's header lists the loops
# and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 512 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 512 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
