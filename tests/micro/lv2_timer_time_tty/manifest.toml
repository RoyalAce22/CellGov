[test]
name = "lv2_timer_time_tty"

# A hardware probe: the timer sleeps, the time queries, timer create and destroy, and sys_tty_write on a bad buffer and a null length pointer.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 256 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 256 },
]

[expect]
outcome = "completed"
