[test]
name = "ppu_code_call_data"

# A hardware probe: a call into a buffer in the title's data segment that
# holds li r3,1; blr. The console capture is the answer; no emulator runs
# it.

[observe]
# 8 big-endian u32 words, as ppu/main.c lists: 32 bytes. Word 0 is the
# done or progress marker, word 1 the step a progress record names,
# word 2 the r3 the call returned, word 3 the buffer's address.
memory_regions = [
  { name = "result", addr = 0, size = 32 },
]

[expect]
outcome = "completed"
