[test]
name = "ppu_lv2_call_sibling"

# A hardware probe of the LV2 round trip of a cheap call and of a yield
# that does not switch threads, while the other hardware thread runs
# user-mode addi, the same cheap call, or yields: eight loops, timed with
# mftb. The probe creates one sibling thread a phase and joins it before
# the next. ppu/main.c's header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 512 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 512 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
