[test]
name = "ppu_issue_mfvscr_lsu_waw"

# A hardware probe of whether the load or store part of a floating-point
# or vector load or store younger than an mfvscr waits for the mfvscr's
# result, and of how fast runs of fixed-point writes to one register
# issue, timed with mftb. The console capture is the answer; ppu/main.c's
# header lists the loops and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 248 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 248 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
