[test]
name = "ppu_vmx_estimate_sweep"

# A hardware probe that compares the vrefp, vrsqrtefp, vexptefp and
# vlogefp model read by ppu_vmx_estimate_readout and
# ppu_vmx_estimate_edges against the instructions over all 2^32 inputs
# under VSCR[NJ] = 0, and over the denormal and near-overflow exponents
# under NJ = 1, and returns only the mismatch counts and the first
# mismatch. A control sweep with one vrefp table entry changed must
# count exactly the 2 x 2^18 inputs of that entry's segment at one
# exponent. The console capture is the answer.

[observe]
# Per sweep (four NJ = 0, four NJ = 1, control): mismatches (u64), first
# mismatching input, the instruction's and the model's result there,
# inputs swept (u64), 0.
memory_regions = [
  { name = "result", addr = 0, size = 288 },
]

[expect]
outcome = "completed"

[ps3]
# Four full 2^32 sweeps with a scalar model per lane take many minutes.
timeout_ms = 1800000
