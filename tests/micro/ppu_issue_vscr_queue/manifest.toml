[test]
name = "ppu_issue_vscr_queue"

# A hardware probe of whether fixed-point instructions after an mtvscr and
# a vector instruction issue past the fenced vector instruction, and how
# many vector instructions fill the VSU issue queue, timed with mftb. The
# console capture is the answer; ppu/main.c's header lists the loops and
# the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 184 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 184 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
