[test]
name = "ppu_issue_barrier_smt"

# A hardware probe of what a sync, lwsync or isync loop on one PPU thread
# costs beside a sibling thread, and what share of its own rate the
# sibling keeps beside it: five chains (sync, lwsync, isync, and an std
# before a sync and before an lwsync), alone and beside a sibling running
# eight independent addi in a loop that counts its rounds in memory and
# reads no time base. The console capture is the answer; ppu/main.c's
# header lists the phases and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 640 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 640 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
