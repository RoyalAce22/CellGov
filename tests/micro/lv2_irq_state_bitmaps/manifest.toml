[test]
name = "lv2_irq_state_bitmaps"

# A hardware probe: the interrupt state bitmaps the running kernel registered with
# lv1 at boot, read back from the kernel's two per-thread records through the CFW's
# lv2 peek. The console capture is the answer; no emulator runs it.

[observe]
# per read, the address and the doubleword there: 22 reads, 352 bytes. The reads are
# the TOC word, the two TOC slots, the record count, then for each of the two records
# the thread word at +0x10 and the eight doublewords of the bitmap at +0x1C0: four
# status doublewords, then four mask doublewords at +0x1E0.
memory_regions = [
  { name = "result", addr = 0, size = 352 },
]

[expect]
outcome = "completed"
