[test]
name = "ppu_issue_fp_store_barrier"

# A hardware probe of what a barrier costs after a single-precision store
# against a double-precision one: by barrier, by stored value, against an
# integer store of the same width, against an frsp and a double store,
# and with independent addi before the barrier, timed with mftb. The
# console capture is the answer; ppu/main.c's header lists the loops and
# the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 248 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 248 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
