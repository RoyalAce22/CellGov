[test]
name = "ppu_may_trap_slbmfev"

# A hardware probe: one instruction the PPE may not run in problem
# state, alone in its run. cases.tsv names it. The console capture is
# the answer: a final frame with what the case recorded, or a progress
# record naming the case that ended the run.

[observe]
# The cgov_cases.h frame for one case: a 16-byte header and two 64-byte
# runs.
memory_regions = [
  { name = "result", addr = 0, size = 144 },
]

[expect]
outcome = "completed"
