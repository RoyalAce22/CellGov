[test]
name = "ppu_issue_mftb"

# A hardware probe of what a time-base read costs the instructions around
# it: seven timed loops (eight mftb; one mftb then seven independent addi,
# seven dependent add or seven independent fadd; and the addi, add and
# fadd chains without an mftb), alone and beside a sibling thread that
# runs mftb in a loop. The console capture is the answer; ppu/main.c's
# header lists the phases and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 640 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 640 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
