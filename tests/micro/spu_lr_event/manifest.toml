[test]
name = "spu_lr_event"

[rpcs3]
binary = "build/spu_lr_event.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
# the status and the event counts after three local actions; the
# putllc status, the event status read after the PPU's store, the count
# after the acknowledgment and the stored word
memory_regions = [
  { name = "local", addr = 0, size = 16 },
  { name = "remote", addr = 16, size = 16 },
]

[expect]
outcome = "completed"

# CellGov title manifest. Build + run:
#   docker run --rm #     -v "$(pwd)/tests/micro/spu_lr_event:/src" #     -v "$(pwd)/tests/micro/common:/common" #     -e COMMON=/common ps3dev bash /src/build.sh
#
#   cargo run --release -p cellgov_cli -- boot run #     --title-manifest tests/micro/spu_lr_event/manifest.toml #     --max-steps 1000000

[cellgov.title]
short_name = "spulrevent"
display_name = "CellGov SPU reservation lost event microtest"
eboot_candidates = ["spu_lr_event.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"
