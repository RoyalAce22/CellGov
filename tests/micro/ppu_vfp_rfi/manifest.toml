[test]
name = "ppu_vfp_rfi"

# A hardware probe of vrfin, vrfiz, vrfip and vrfim, four different
# slots a case, each case under NJ = 0 and NJ = 1. It settles the ties
# under round to nearest, values at and above 2^23, the sign of a zero
# result, infinities and an SNaN, and the denormals: the vrfim page names
# no NJ rule, so its negative denormal under NJ = 1 is the open result.
# Each case sets VSCR with mtvscr first. cases.tsv names each case. The
# console capture is the answer.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case (32 cases).
memory_regions = [
  { name = "result", addr = 0, size = 4112 },
]

[expect]
outcome = "completed"
