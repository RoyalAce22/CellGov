[test]
name = "ppu_cr_moves"

# A hardware probe of the condition-register logical instructions and moves.
# cases.tsv lists the 169 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 21648 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
