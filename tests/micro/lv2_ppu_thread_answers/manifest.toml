[test]
name = "lv2_ppu_thread_answers"

# A hardware probe: the PPU thread priority, create, start and join answers.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u32 words at the offsets ppu/main.c lists: 192 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 192 },
]

[expect]
outcome = "completed"
