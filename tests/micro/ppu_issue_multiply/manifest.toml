[test]
name = "ppu_issue_multiply"

# A hardware probe of what a multiply chain loses beside a sibling PPU
# thread that stalls the shared issue point: seven timed chains
# (dependent mulli, mullw, mulld and mulhw, independent mulli, mulli
# with an independent add between, and dependent add), alone and beside
# a sibling running dependent divd, fdiv or mulld. The console capture
# is the answer; ppu/main.c's header lists the phases and the payload
# layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 1152 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 1152 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 90000
