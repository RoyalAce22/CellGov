[test]
name = "ppu_issue_vscr_elem"

# A hardware probe of which VMX element stores and single-precision FP
# loads an mtvscr holds past its fence, and for how long, timed with mftb.
# The console capture is the answer; ppu/main.c's header lists the loops
# and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 216 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 216 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
