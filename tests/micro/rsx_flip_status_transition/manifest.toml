[test]
name = "rsx_flip_status_transition"

# Structural microtest. A PPU thread writes a GCM_FLIP_COMMAND
# method to the FIFO, advances put, and polls the flip-status
# mirror through its WAITING -> DONE transition. Exercises the
# RSX flip-status state machine end-to-end.

[rpcs3]
binary = "build/rsx_flip_status_transition.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
memory_regions = [
  { name = "result", addr = 0, size = 16 },
]

[expect]
outcome = "completed"

[cellgov.title]
short_name = "rxflp"
display_name = "CellGov RSX flip-status-transition microtest"
eboot_candidates = ["rsx_flip_status_transition.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"

[cellgov.rsx]
mirror = true
consume = true
# The guest seeds cursor.get by storing to the MMIO GET slot, and
# only the FIFO consumer reconciles cursor.get from MMIO
# (mirror_rsx_control_register_writes mirrors PUT and REF, not GET).
# Without this the drain walks from get = 0 and never reaches the
# commands this test wrote.
