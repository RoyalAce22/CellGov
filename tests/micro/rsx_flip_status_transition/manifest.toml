[test]
name = "rsx_flip_status_transition"

# Structural microtest. The PPU brings up an RSX context through
# libgcm, sets one 1080p display buffer in RSX local memory (the video
# output keeps the mode the XMB left it in), resets the flip status,
# queues a flip, and polls the flip status through its WAITING -> DONE
# transition. Exercises the RSX flip-status state machine end-to-end.

[rpcs3]
binary = "build/rsx_flip_status_transition.elf"
decoder = "interpreter"
timeout_ms = 10000

[observe]
memory_regions = [
  { name = "result", addr = 0, size = 16 },
]

[expect]
outcome = "completed"

[cellgov.title]
short_name = "rxflp"
display_name = "CellGov RSX flip-status-transition microtest"
eboot_candidates = ["rsx_flip_status_transition.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"

[cellgov.rsx]
# The RSX region writable, the runtime's writeback mirror on, and the
# FIFO consumer draining what libgcm puts in the command buffer.
mirror = true
consume = true

[ps3]
# Bytes the design table leaves free (Any): a hardware run may vary them.
volatile = [
  { region = "result", offset = 8, size = 4, reason = "the poll count depends on when the flip lands" },
]
