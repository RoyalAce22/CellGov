[test]
name = "spu_list_bad_ea"

# A hardware probe: an SPU thread puts a three-element list whose second
# element is 16 bytes to an effective address 4 bytes past a 16-byte
# boundary, in a group whose exception event goes to a
# PPU event queue. The capture holds the event the kernel sends, how the
# group ends, and which elements reached the buffer.

[observe]
# The failed step and the answers of receive, terminate, join,
# disconnect and the two destroys; the event; the group and thread ids
# and the buffer's address; the buffer's words at the elements'
# destinations: 112 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 112 },
]

[expect]
outcome = "completed"

[cellgov.title]
short_name = "spulistbadea"
display_name = "CellGov SPU list bad element address microtest"
eboot_candidates = ["spu_list_bad_ea.elf"]
year = 2026
developer = "CellGov"
engine = "microtest"
distribution = "microtest"

[cellgov.source]
kind = "manifest-relative"
path = "build"

[cellgov.checkpoint]
kind = "process-exit"

[ps3]
# The PPU opens the SPU image under /app_home/, so it deploys
# beside the EBOOT.
files = ["spu_main.elf"]
# The console's group and thread ids carry a system-wide serial, in the
# event's data1 and in the ids the probe records.
volatile = [
  { region = "result", offset = 24, size = 8, reason = "event data1: group and thread ids" },
  { region = "result", offset = 80, size = 8, reason = "group and thread ids" },
]
