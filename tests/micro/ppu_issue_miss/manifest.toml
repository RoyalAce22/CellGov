[test]
name = "ppu_issue_miss"

# A hardware probe of whether a sibling's stalls delay a load miss's
# result: a pointer chase through a shuffled 8 MB ring, one L2 miss a
# load, with 0, 8, 16 or 32 independent addi after each load, alone and
# beside a sibling of dependent fdiv or dependent divd. The console
# capture is the answer; ppu/main.c's header lists the phases and the
# payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 640 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 640 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 120000
