[test]
name = "ppu_may_trap_rsx_lwarx"

# A hardware probe: an aligned lwarx inside RSX local memory once libgcm has
# brought up an RSX context. It may end or stop the process, so a
# progress record names it before it runs. The console capture is the
# answer; no emulator runs it.

[observe]
# 6 big-endian u64 (48 bytes): DONE or PROG, the step the progress
# record names, rsxInit rc, the local memory address, the lwarx EA,
# lwarx result (SKIP until it completes).
memory_regions = [
  { name = "result", addr = 0, size = 48 },
]

[expect]
outcome = "completed"

[ps3]
# The access stops the process and the title never returns to the XMB,
# so the runner keeps no capture. The same reason is the test's row in
# tests/micro/ps3_gaps.tsv.
portable = false
not_portable_reason = "the lwarx at RSX local memory + 0x40 stops the game process after the progress record that names it; the title hangs until webMAN's exit clears it"
