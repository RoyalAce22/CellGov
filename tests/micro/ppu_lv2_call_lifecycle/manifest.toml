[test]
name = "ppu_lv2_call_lifecycle"

# A hardware probe of the LV2 round trip of creating and destroying each
# synchronization object class: lightweight mutex, mutex, semaphore,
# event flag and condition variable, 128 objects a run, timed with mftb.
# The console capture is the answer; ppu/main.c's header lists the loops
# and the payload layout.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 512 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 512 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
