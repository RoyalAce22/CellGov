[test]
name = "ppu_fp_stores"

# A hardware probe of the floating-point stores at aligned addresses.
# cases.tsv lists the 131 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 16784 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
