[test]
name = "ppu_branch_keeps_fpr_vr"

# A hardware probe of whether a taken branch keeps the FPRs, the VRs and
# the FPSCR: b, bc, bdnz, bl, bcl, bctr, bctrl and blr, each to the word
# after it, with two FPRs, a VR and the FPSCR loaded before it.
# cases.tsv names each case. The console capture is the answer.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case (9 cases). Each run records CR, XER, the FPSCR, f3, f13 and v3.
memory_regions = [
  { name = "result", addr = 0, size = 1168 },
]

[expect]
outcome = "completed"
