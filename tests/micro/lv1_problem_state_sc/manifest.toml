[test]
name = "lv1_problem_state_sc"

# A hardware probe: five `sc 1` calls from a game's PPU thread in problem state, each with marks in r3 to r10 (0xC0DE000000000000 | reg << 8 | case index).
# Numbers in order: 256, 0xFFFF and 0x8000000000000000 (past the end of lv1's hypercall table), 14 (an invalid entry of the live 4.93 table) and 74 (get_logical_partition_id).
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words: 0 the case count (5), then from 8 per case 72 bytes: the number sent in r11, then r3 to r10 as the call returned them. 368 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 368 },
]

[expect]
outcome = "completed"
