[test]
name = "ppu_vscr_rules"

# A hardware probe of the VSCR's own rules over several words.
# cases.tsv lists the 10 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 1296 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
