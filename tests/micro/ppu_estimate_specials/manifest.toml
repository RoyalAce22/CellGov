[test]
name = "ppu_estimate_specials"

# A hardware probe: what fres and frsqrte return for each special operand
# the PowerPC book tabulates, and for a few ordinary operands. The console
# capture is the answer; no emulator runs it.

[observe]
# 52 big-endian u32 words, as ppu/main.c lists: 208 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 208 },
]

[expect]
outcome = "completed"
