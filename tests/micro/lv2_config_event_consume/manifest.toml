[test]
name = "lv2_config_event_consume"

# A hardware probe: which sys_config_get_service_event reads consume the event they read.
# The console capture is the answer; no emulator runs it.

[observe]
# Big-endian u64 words at the offsets ppu/main.c lists: 256 bytes.
memory_regions = [
  { name = "result", addr = 0, size = 256 },
]

[expect]
outcome = "completed"
