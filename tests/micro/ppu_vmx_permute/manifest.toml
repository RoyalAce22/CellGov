[test]
name = "ppu_vmx_permute"

# A hardware probe of the vector permute, merge, splat, shift and logical instructions.
# cases.tsv lists the 148 cases. The console capture is the answer;
# no emulator runs it.

[observe]
# The cgov_cases.h frame: a 16-byte header, then two 64-byte runs per
# case.
memory_regions = [
  { name = "result", addr = 0, size = 18960 },
]

[expect]
outcome = "completed"

[ps3]
timeout_ms = 60000
