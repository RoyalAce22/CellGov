name: corpus

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  regression:
    name: corpus and anchor regression check
    runs-on: [self-hosted, Windows, X64, cellgov-corpus]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Run corpus and anchor gates
        shell: bash
        run: bash .github/corpus.sh
