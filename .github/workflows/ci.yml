name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing in this workflow writes to the repository: no release, no
# comment, no push. A leaked token from any step can only read. The `CI`
# job alone also reads this run's job records, to class each failure.
permissions:
  contents: read

# A second push to one branch makes the earlier run's verdict stale
# before it finishes; cancel it instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The budget: every blocking lint and test leg finishes in 30 minutes.
# Each such leg's `timeout-minutes` is 40, a margin above the budget, so a
# leg that overruns it goes red as `infrastructure` in the `CI` summary
# instead of running on. `.github/ci.sh` prints the time of every command
# group; those lines show which group took the time. Raise the budget
# here, in this one comment and the two timeouts, not per leg.

defaults:
  run:
    # windows-latest defaults to pwsh, where `$EXTERNAL_DATA_FEATURES` is not
    # an environment variable and `grep | cut` does not exist. Every
    # `run:` below reads the same under bash on both runners.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # External-data suites compile here; operators execute them separately.
  EXTERNAL_DATA_FEATURES: >-
    cellgov_install/decrypt,cellgov_cli/decrypt,cellgov_cli/installed-title-tests,cellgov_cli/microtests,cellgov_cli/ps3autotests,cellgov_install/npdrm-oracle-vectors,cellgov_install/installed-title-tests,cellgov_install/title-dumps,cellgov_install/installed-firmware-tests,cellgov_install/firmware-dumps,cellgov_ppu/ppu-microtests,cellgov_spu/spu-microtests,cellgov_compare/rpcs3-runner

jobs:
  # `strategy.matrix` cannot read `env`, so the MSRV reaches the matrix
  # as a job output rather than a second copy of the number. Only the
  # output is consumed downstream; nothing assumes which runner read it.
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      msrv: ${{ steps.read.outputs.msrv }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read MSRV from [workspace.package]
        id: read
        run: |
          msrv=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV is $msrv"

      - name: Validate workflow and shell syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          bash -n .github/ci.sh .github/ci_verdict.sh .github/external-data.sh .github/fuzz.sh .github/loader_fuzz.sh

  # The only job that denies warnings. The pinned entry is blocking, on
  # a version that moves only when this file does; the stable entry is
  # informational, so lints added upstream show up before the pin is
  # bumped. Linux only: fmt and clippy output does not vary by platform.
  #
  # The pinned version is written once, in the matrix; the job name is
  # derived from it so the number is not copied.
  lint:
    name: lint (${{ matrix.informational && 'stable, informational' || format('pinned {0}', matrix.toolchain) }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.95.0"
            informational: false
          - toolchain: stable
            informational: true
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      # See the note on the test job's cache step.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && !matrix.informational }}

      - name: repository lint
        run: bash .github/ci.sh lint

  # Blocking. Known vulnerabilities in the dependency tree, from the
  # RustSec advisory database; every dependency's declared license
  # against the allow list in deny.toml; a refusal of any git or
  # unknown-registry source; and the dependency shape (no wildcard
  # version, duplicates reported). cargo-deny over cargo-audit: audit
  # reads advisories only; deny checks all four from the same lock file
  # in one run. A new advisory fails this job with no change to the
  # tree; deny.toml says how to answer it.
  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  # No `-D warnings`: a warning is not a test failure. `beta` is
  # informational. The release run is required -- debug_assert! compiles
  # out, so a #[should_panic] on a debug-only assertion only fails there.
  #
  # Every toolchain runs on both runners: the project is developed on
  # Windows and ships for Windows and Linux, and a path, line-ending,
  # console or file-locking assumption only fails on the other one.
  test:
    name: test (${{ matrix.name }}, ${{ matrix.os }})
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        name: [msrv, stable, beta]
        include:
          - name: msrv
            toolchain: ${{ needs.config.outputs.msrv }}
            informational: false
          - name: stable
            toolchain: stable
            informational: false
          - name: beta
            toolchain: beta
            informational: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Exports RUSTUP_TOOLCHAIN, which outranks rust-toolchain.toml.
      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}

      # Third-party dependency artifacts only. A checkout resets source
      # mtimes, so every workspace crate rebuilds whatever a cache holds;
      # rust-cache drops them, incremental output and stale files before
      # it saves, and sets CARGO_INCREMENTAL=0. GitHub keeps 10 GB per
      # repository and evicts the least recently used entry, so only a
      # run on main saves, and only from the pinned lint leg and the two
      # stable test legs: three entries. The key names the OS, the
      # toolchain, Cargo.lock and the CARGO*/RUST* environment, so the
      # other toolchains' legs find no entry and build uncached.
      # `shared-key` drops the job name, so `fuzz.yml` restores the
      # stable entry by the same key and saves nothing.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.name == 'stable' }}

      - name: repository tests
        run: bash .github/ci.sh test

      # A fuzz finding's artifact names its exact replay; the log prints
      # the same line, and the file is what a reader replays from.
      - name: Upload fuzz smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-${{ matrix.name }}-${{ matrix.os }}
          path: target/fuzz-smoke/
          if-no-files-found: ignore

  success:
    name: CI
    if: always()
    needs: [config, lint, deny, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # One row per leg: its result and, when it is not green, whether
      # the cause is infrastructure, a test, compile/lint, or a newer push.
      # The table explains the verdict; it never changes it.
      - name: Class every leg
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/ci_verdict.sh "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" CI \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require all blocking checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
