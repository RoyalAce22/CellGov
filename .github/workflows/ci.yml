name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Suites reading a local PS3 corpus sit behind cellgov_cli's
  # firmware-corpus / title-corpus features and are not built here.
  # CI still type-checks and lints them so they cannot bitrot.
  CORPUS_FEATURES: cellgov_cli/title-corpus

jobs:
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --locked

      - name: cargo check (MSRV, corpus suites)
        run: cargo check --workspace --all-targets --locked --features "$CORPUS_FEATURES"

  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (corpus suites)
        run: cargo clippy --workspace --all-targets --features "$CORPUS_FEATURES" -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test --release
        run: cargo test --workspace --release

      - name: cargo bench --no-run --benches
        run: cargo bench --workspace --no-run --benches
