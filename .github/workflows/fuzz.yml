name: fuzz

# The long fuzz runs: full-budget campaigns, bounded raw decoder scans and
# repeated-trial evaluations. None of these belongs in the continuous
# build, which runs only the bounded smoke set from ci.sh. Every job here
# reads the same library, result and artifact contracts as that set.
on:
  schedule:
    # Weekly, Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: Case indices each campaign considers
        default: "20000"
        type: string
      trials:
        description: Trials each evaluation runs
        default: "10"
        type: string
      raw_words:
        description: Words each raw decoder scan classifies
        default: "16777216"
        type: string

# Nothing here writes to the repository. A finding is an uploaded artifact
# and a red job, never a commit or a comment.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  FUZZ_CASES: ${{ inputs.cases || '20000' }}
  FUZZ_TRIALS: ${{ inputs.trials || '10' }}
  FUZZ_RAW_WORDS: ${{ inputs.raw_words || '16777216' }}

jobs:
  # Every job runs on both runners: a finding that depends on the platform
  # is a finding about the platform.
  scheduled:
    name: ${{ matrix.job }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        job: [campaigns, raw, evaluate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: ${{ matrix.job }}
        run: bash .github/fuzz.sh ${{ matrix.job }}

      # Findings, raw results and evaluations are the run's output whether
      # or not a job went red; a finding's artifact names its exact replay.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.job }}-${{ matrix.os }}
          path: target/fuzz-scheduled/
          if-no-files-found: ignore
