name: loader-fuzz

# The coverage-guided jobs over the parsers that take attacker-shaped
# input: the ELF loader, the PRX parser, the import walk and the
# function-map builder. Each target asserts one property, that the
# parser returns with a value or its typed error on any bytes, and a
# panic is the finding. libFuzzer needs a nightly toolchain, so the
# jobs run here on a schedule rather than in the continuous build; the
# bounded stable sample of the same property runs in
# `cargo test -p cellgov_fuzz`. The corpus a run grows is cached for
# the next one, seeded from the committed images under fuzz/seeds.
on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loader-fuzz-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [pt_load_segments, load_ppu_elf, parse_prx, parse_imports, funcmap_build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # A dated nightly, so a toolchain change is a change to this file.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-08-22

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Restore the corpus the last run grew
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: loader-fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            loader-fuzz-${{ matrix.target }}-

      - name: Fuzz the target
        env:
          FUZZ_TOOLCHAIN: nightly-2026-08-22
        run: bash .github/loader_fuzz.sh run '${{ matrix.target }}'

      # Saved on failure too: the inputs that reached the crash are the
      # corpus the next run should start from.
      - name: Save the corpus for the next run
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: loader-fuzz-${{ matrix.target }}-${{ github.run_id }}

      # A crash artifact replays with
      # `cargo +nightly fuzz run --fuzz-dir fuzz <target> <artifact>`.
      - name: Preserve the crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loader-fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 90
