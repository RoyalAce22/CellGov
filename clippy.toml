    { path = "std::fs::File::open", reason = "the runtime opens no file: the host supplies bytes or a source trait" },
    { path = "std::fs::File::create", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::File::create_new", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::OpenOptions::open", reason = "the runtime opens no file: the host supplies bytes or a source trait" },
    { path = "std::io::stdin", reason = "the runtime reads no console: the host supplies bytes or a source trait" },
    { path = "std::io::stdout", reason = "the runtime writes to no console: it reports to a sink the host supplies" },
    { path = "std::io::stderr", reason = "the runtime writes to no console: it reports to a sink the host supplies" },
    { path = "std::process::Command::new", reason = "the runtime starts no host process: the host runs other programs" },
    { path = "std::process::exit", reason = "the runtime ends no process: a refusal is a named error the host acts on" },
    { path = "std::process::abort", reason = "the runtime ends no process: a refusal is a named error the host acts on" },
    { path = "std::sync::OnceLock::new", reason = "the runtime keeps no process-global state" },
    { path = "std::sync::LazyLock::new", reason = "the runtime keeps no process-global state" },
    { path = "std::sync::Once::new", reason = "the runtime keeps no process-global state" },
    { path = "std::thread::LocalKey::with", reason = "the runtime keeps no process-global state" },
    { path = "std::thread::LocalKey::try_with", reason = "the runtime keeps no process-global state" },
    { path = "std::thread::LocalKey::with_borrow", reason = "the runtime keeps no process-global state" },
    { path = "std::thread::LocalKey::with_borrow_mut", reason = "the runtime keeps no process-global state" },
    { path = "std::thread::LocalKey::set", reason = "the runtime keeps no process-global state" },
    { path = "std::thread::LocalKey::get", reason = "the runtime keeps no process-global state" },
