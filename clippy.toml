    { path = "std::path::Path::canonicalize", reason = "the runtime opens no file: the host supplies bytes or a source trait" },
    { path = "std::fs::write", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::copy", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::hard_link", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::set_permissions", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::create_dir", reason = "the runtime writes no file: it reports to an observer the host installs" },
    { path = "std::fs::create_dir_all", reason = "the runtime writes no file: it reports to an observer the host installs" },
