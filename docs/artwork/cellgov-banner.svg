<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="340" viewBox="0 0 680 170" role="img" aria-label="CellGov">
<title>CellGov</title>
<desc>Six input lanes of ticks move at staggered tempos into a bright vertical gate and leave as one evenly paced lane beside the CellGov wordmark.</desc>
<style>
@media (prefers-reduced-motion: no-preference) {
@keyframes march {
0%{stroke-dashoffset:0}8%{stroke-dashoffset:-8}14%{stroke-dashoffset:-12}
22%{stroke-dashoffset:-70}28%{stroke-dashoffset:-78}38%{stroke-dashoffset:-84}
46%{stroke-dashoffset:-140}54%{stroke-dashoffset:-148}62%{stroke-dashoffset:-152}
72%{stroke-dashoffset:-205}80%{stroke-dashoffset:-212}90%{stroke-dashoffset:-218}
100%{stroke-dashoffset:-240}
}
@keyframes mout{to{stroke-dashoffset:-198}}
@keyframes gpulse{0%,100%{opacity:.6}50%{opacity:1}}
.lane{animation-name:march;animation-timing-function:linear;animation-iteration-count:infinite}
.l1{animation-duration:15s;animation-delay:-0s}
.l2{animation-duration:16s;animation-delay:-3.5s}
.l3{animation-duration:17s;animation-delay:-9s}
.l4{animation-duration:18.5s;animation-delay:-13s}
.l5{animation-duration:19s;animation-delay:-5.5s}
.l6{animation-duration:21s;animation-delay:-17.5s}
.out{animation-name:mout;animation-duration:3.6s}
.gate{animation:gpulse 2.8s ease-in-out infinite}
}
.b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.8px;fill:#4E7F7A}
</style>
