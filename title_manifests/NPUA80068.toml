[title]
content_id = "NPUA80068"
short_name = "sshd"
display_name = "Super Stardust HD"
eboot_candidates = ["EBOOT.BIN", "EBOOT.elf"]
year = 2007
developer = "Housemarque"
engine = "Housemarque proprietary"
distribution = "psn-hdd"
rap_filename = "UP9000-NPUA80068_00-STARDUSTFULL0001.rap"
# This title does not reach its checkpoint -- the cap is what ends the
# run, so its recorded MaxSteps outcome and step count only reproduce
# at this exact value.
bench_max_steps = 100_000_000
# PS3_SYSTEM_VER from the title's own PARAM.SFO (03.7000), held against
# the installed content by the `installed-title-tests` suite. Derives the one cell
# the headline row is measured at: fw 3.70 x base.
system_ver = "3.70"

[checkpoint]
kind = "first-rsx-write"

# Drift study: the same title on the newest firmware. Recorded evidence
# about how much of a divergence is the firmware's rather than the
# title's.
[[bench.matrix]]
fw = "4.93"
game_ver = "base"
