[title]
content_id = "NPUA80001"
short_name = "flow"
display_name = "flOw"
eboot_candidates = ["EBOOT.BIN", "EBOOT.elf"]
year = 2007
developer = "thatgamecompany"
engine = "PhyreEngine"
distribution = "psn-hdd"
rap_filename = "UP9000-NPUA80001_00-FLOWPS3PROMOTION.rap"
# PS3_SYSTEM_VER from the title's own PARAM.SFO (01.5000), held against
# the installed content by the title-corpus suite. Derives the one cell
# the headline row is measured at: fw 1.50 x base.
system_ver = "1.50"

[checkpoint]
kind = "process-exit"

[rsx]
mirror = true
consume = true

# Both blocks read from the EBOOT's own USRDIR unless the env var
# points elsewhere; a PSN install carries every XML the resource
# loader opens.
[content]
override_base_env = "CELLGOV_NPUA80001_CONTENT_DIR"
files = [
    { guest_path = "/app_home/Data/Resources/first.xml", host_path = "Data/Resources/first.xml" },
    { guest_path = "/app_home/Data/Local/Localization.xml", host_path = "Data/Local/Localization.xml" },
    { guest_path = "/app_home/Data/Classes/Classes.xml", host_path = "Data/Classes/Classes.xml" },
]

[[fs.mounts]]
prefix = "/app_home"
override_env = "CELLGOV_NPUA80001_CONTENT_DIR"

# Drift study: the same title on the newest firmware, seventeen years
# past its floor. Recorded evidence about how much of a divergence is
# the firmware's rather than the title's.
[[bench.matrix]]
fw = "4.93"
game_ver = "base"
