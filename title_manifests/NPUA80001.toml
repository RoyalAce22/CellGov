[title]
content_id = "NPUA80001"
short_name = "flow"
display_name = "flOw"
eboot_candidates = ["EBOOT.BIN", "EBOOT.elf"]
year = 2007
developer = "thatgamecompany"
engine = "PhyreEngine"
distribution = "psn-hdd"
rap_filename = "UP9000-NPUA80001_00-FLOWPS3PROMOTION.rap"
# PS3_SYSTEM_VER from the title's own PARAM.SFO (01.5000), held against
# the installed content by the `installed-title-tests` suite. The floor is
# metadata: every title's headline row is measured at the reference
# firmware, fw 4.93 x base, the firmware consoles run today.
system_ver = "1.50"

[checkpoint]
kind = "process-exit"

[rsx]
mirror = true
consume = true

# The mount reads from the EBOOT's own USRDIR unless the env var
# points elsewhere; a PSN install carries every XML the resource
# loader opens, so nothing is pre-registered.
[[fs.mounts]]
prefix = "/app_home"
override_env = "CELLGOV_NPUA80001_CONTENT_DIR"

# Drift study: the title at its own floor; not gated.
[[bench.matrix]]
fw = "1.50"
game_ver = "base"
pending = "the resident title image or firmware set crosses the fixed TLS reservation, so boot refuses before TLS initialization"

# The reference cell's reason it has no measurement yet.
[[bench.matrix]]
fw = "4.93"
game_ver = "base"
pending = "the resident title image or firmware set crosses the fixed TLS reservation, so boot refuses before TLS initialization"
