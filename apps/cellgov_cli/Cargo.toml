[package]
name = "cellgov_cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# One binary for the whole project. The crate keeps its name so the
# workspace DAG reads the same; the command operators type is `cellgov`.
[[bin]]
name = "cellgov"
path = "src/main.rs"

[dependencies]
cellgov_compare = { path = "../../crates/cellgov_compare" }
cellgov_core = { path = "../../crates/cellgov_core" }
cellgov_effects = { path = "../../crates/cellgov_effects" }
cellgov_event = { path = "../../crates/cellgov_event" }
cellgov_exec = { path = "../../crates/cellgov_exec" }
cellgov_explore = { path = "../../crates/cellgov_explore" }
cellgov_install = { path = "../cellgov_install" }
cellgov_lv2 = { path = "../../crates/cellgov_lv2" }
cellgov_mem = { path = "../../crates/cellgov_mem" }
cellgov_ppu = { path = "../../crates/cellgov_ppu" }
cellgov_ps3_abi = { path = "../../crates/cellgov_ps3_abi" }
cellgov_spu = { path = "../../crates/cellgov_spu" }
cellgov_terminal = { path = "../../crates/cellgov_terminal" }
cellgov_testkit = { path = "../../crates/cellgov_testkit" }
cellgov_time = { path = "../../crates/cellgov_time" }
cellgov_trace = { path = "../../crates/cellgov_trace" }
# The command tree, its help, and its typo suggestions are declarative
# here; the hand-rolled equivalent for a two-level tree with global
# flags is a subsystem this crate would own outright.
clap = { version = "4", features = ["derive"] }
# Shell completion scripts for the same command tree clap already
# holds, so a completion cannot describe a command that does not exist.
clap_complete = "4"
# Read-only file mapping with a safe API, for containers too large to
# hold resident (a BD-DL ISO is up to 50 GB; fs::read commits it all).
# Chosen over memmap2 because its map call is not `unsafe fn`, keeping
# the workspace's forbid(unsafe_code) intact.
filebuffer = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
strum = { version = "0.26", default-features = false, features = ["derive"] }

[dev-dependencies]
sysinfo = "0.32"

[features]
# SCE/SELF decryption at load time (`cellgov_install/decrypt`). Off by
# default: the CLI then boots and inspects plaintext ELFs only, and an
# SCE-wrapped input is refused by name. Installed firmware and titles
# stay SCE-wrapped on disk, so booting a real corpus needs it.
decrypt = ["cellgov_install/decrypt"]

# Suites that read the operator's local PS3 corpus. Firmware comes from
# a console update package; titles come from owned game dumps. Both are
# gitignored and cannot exist on a hosted runner, so the targets below
# are not built unless the operator opts in -- a bare `cargo test` then
# reports green only for gates that actually ran. The corpus is
# SCE-wrapped, so both imply `decrypt`.
firmware-corpus = ["decrypt"]
title-corpus = ["firmware-corpus"]

# Suites that boot the micro-test ELFs built by tests/micro/*/build.sh.
# The C sources are committed and the toolchain instructions ship with
# them, but the build output is gitignored, so opting in declares the
# corpus built and a missing artifact is a hard error. The spawn suite
# wraps a child in a real SCE container, so it needs `decrypt`.
microtests = ["decrypt"]

# Suite that boots the ps3autotests corpus -- a GPLv2 tree the
# developer clones locally (tests/ps3autotests.README.md), never
# vendored, so cellgov stays MIT/Apache-2.0.
ps3autotests = []

[[test]]
name = "firmware_set_load"
required-features = ["firmware-corpus"]

[[test]]
name = "ps3autotests"
required-features = ["ps3autotests"]

[[test]]
name = "process_spawn_microtest"
required-features = ["microtests"]

[[test]]
name = "microtests"
required-features = ["microtests"]

[[test]]
name = "title_witnesses"
required-features = ["title-corpus"]

[[test]]
name = "obs_null_sink"
required-features = ["title-corpus"]

[[test]]
name = "authority_id"
required-features = ["title-corpus"]

[[test]]
name = "bench_stdout_purity"
required-features = ["title-corpus"]
