[package]
name = "cellgov_install"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "cellgov_install"
path = "src/lib.rs"

[[bin]]
name = "cellgov_install"
path = "src/main.rs"

[dependencies]
cellgov_ps3_abi = { path = "../../crates/cellgov_ps3_abi" }
cellgov_terminal = { path = "../../crates/cellgov_terminal" }
# The cipher, MAC, and inflate crates serve only the key-consuming
# decrypt paths, so they enter the build with the `decrypt` feature.
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
ctr = { version = "0.9", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
flate2 = { version = "1", optional = true }
# Read-only file mapping with a safe API, for disc images too large to
# hold resident (a BD-DL ISO is up to 50 GB; fs::read commits it all).
# Chosen over memmap2 because its map call is not `unsafe fn`, keeping
# the workspace's forbid(unsafe_code) intact.
filebuffer = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

[features]
# Every key-consuming path: the SCE/SELF decrypt pipeline, the NPDRM
# klicensee derivation, PKG content decryption, and PUP HMAC
# validation. Off by default: the crate then parses containers (SCE /
# PUP / PKG headers, ISO9660) and hands plaintext images through, and
# every SCE-wrapped input is refused with
# `SceError::DecryptFeatureDisabled`. A build without it links no
# cipher crate. No build carries key material: the decrypt paths read
# the operator's vault (`keys` module) at run time.
decrypt = ["dep:aes", "dep:cbc", "dep:ctr", "dep:hmac", "dep:sha1", "dep:flate2"]

# The NPDRM witness suite: RAP -> klicensee derivations and the EBOOT
# decrypts they open, read at run time from the operator's manifest at
# vfs/.cellgov/npdrm_oracle_vectors.toml. Same contract as the corpus
# features: off means not built, on means a missing manifest is a hard
# failure. The manifest names the titles, so the source names none.
npdrm-oracle-vectors = ["decrypt"]

# Suites that install a title from an operator-owned raw dump: a
# retail PKG plus its RAP, or a ~2GB decrypted disc image, read from
# the dump root. Distinct from title-corpus: owning the installed
# result under vfs/ does not mean the raw dump was kept, and these
# suites install from scratch. An install runs the decrypt-proof, so
# the feature implies `decrypt`.
title-dumps = ["decrypt"]

# Suites that read titles already installed under vfs/. Off by default
# so a fresh checkout neither builds nor silently skips them; on, they
# hard-assert. CI type-checks and lints them so they cannot bitrot.
# The installed EBOOTs are SELFs, so the suites need `decrypt`.
title-corpus = ["decrypt"]

# Suites that read firmware already installed under vfs/dev_flash.
# Same contract as title-corpus: off means not built, on means
# hard-assert. The installed modules stay SCE-wrapped on disk, so the
# suites need `decrypt`.
firmware-corpus = ["decrypt"]

# Suite that installs firmware from an operator-owned PS3UPDAT.PUP in
# the dump root. Distinct from firmware-corpus for the same reason
# title-dumps is distinct from title-corpus: having the installed
# result under vfs/ does not mean the update package was kept.
firmware-dumps = ["decrypt"]

[[test]]
name = "npdrm_oracle_vectors"
required-features = ["npdrm-oracle-vectors"]

[[test]]
name = "parity_pkg"
required-features = ["title-dumps"]

[[test]]
name = "parity_disc"
required-features = ["title-dumps"]

[[test]]
name = "parity_title_digests"
required-features = ["title-corpus"]

[[test]]
name = "firmware_pipeline_end_to_end"
required-features = ["firmware-dumps"]

[[test]]
name = "parity_firmware_decrypt"
required-features = ["firmware-corpus"]

[lints]
workspace = true
