[package]
name = "cellgov_boot"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cellgov_compare = { path = "../cellgov_compare" }
cellgov_core = { path = "../cellgov_core" }
cellgov_effects = { path = "../cellgov_effects" }
cellgov_event = { path = "../cellgov_event" }
cellgov_exec = { path = "../cellgov_exec" }
cellgov_install = { path = "../../apps/cellgov_install" }
cellgov_lv2 = { path = "../cellgov_lv2" }
cellgov_mem = { path = "../cellgov_mem" }
cellgov_ppu = { path = "../cellgov_ppu" }
cellgov_ps3_abi = { path = "../cellgov_ps3_abi" }
cellgov_spu = { path = "../cellgov_spu" }
cellgov_terminal = { path = "../cellgov_terminal" }
cellgov_time = { path = "../cellgov_time" }
cellgov_trace = { path = "../cellgov_trace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", default-features = false, features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
cellgov_lv2_archive = { path = "../cellgov_lv2_archive" }
cellgov_testkit = { path = "../cellgov_testkit", features = ["scratch"] }
