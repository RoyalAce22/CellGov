[package]
name = "cellgov_observation"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Run identities fingerprint with the runtime's FNV-1a hasher.
cellgov_mem = { path = "../cellgov_mem" }
# State hashes and the run-identity trace header.
cellgov_trace = { path = "../cellgov_trace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A committed console capture's frame is checked against its recorded
# SHA-256.
sha2 = "0.10"
strum = { version = "0.26", default-features = false, features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
cellgov_testkit = { path = "../cellgov_testkit", features = ["scratch"] }
