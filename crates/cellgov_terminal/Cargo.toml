[package]
name = "cellgov_terminal"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The console width query: an ioctl on Unix and a console-info call on
# Windows, both FFI that forbid(unsafe_code) keeps out of this tree.
# `COLUMNS` is a shell variable that is almost never exported, so
# without the query every terminal reads as 80 columns.
terminal_size = "0.4"
# The Ctrl-C handler that restores the terminal: `sigaction` on Unix
# and `SetConsoleCtrlHandler` on Windows, the same FFI standing as the
# width query.
ctrlc = "3.5"

[target.'cfg(unix)'.dependencies]
# Ends an interrupted process the way the default action would: the
# disposition back to default, then the signal re-raised, so the
# process dies by SIGINT rather than exiting 130. A shell loop breaks
# on the former and not the latter. `sigaction` and `raise`, the same
# FFI standing as ctrlc; nothing else of the crate is used.
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
# Delivers the interrupt in the Ctrl-C test without a shell. Already
# in the graph through ctrlc.
nix = { version = "0.31", default-features = false, features = ["signal"] }
