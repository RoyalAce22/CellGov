[package]
name = "cellgov_core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cellgov_time = { path = "../cellgov_time" }
cellgov_event = { path = "../cellgov_event" }
cellgov_mem = { path = "../cellgov_mem" }
cellgov_effects = { path = "../cellgov_effects" }
cellgov_sync = { path = "../cellgov_sync" }
cellgov_dma = { path = "../cellgov_dma" }
cellgov_exec = { path = "../cellgov_exec" }
cellgov_lv2 = { path = "../cellgov_lv2" }
cellgov_ps3_abi = { path = "../cellgov_ps3_abi" }
cellgov_trace = { path = "../cellgov_trace" }
thiserror = "2"
# The runtime publishes its refusal enums as machine-readable variant
# lists, so a sweep over "every way a step can refuse" cannot silently
# stop being exhaustive when a variant is added.
strum = { version = "0.26", default-features = false, features = ["derive"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "core_bench"
harness = false
