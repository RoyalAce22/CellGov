[package]
name = "cellgov_lv2"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cellgov_effects = { path = "../cellgov_effects" }
cellgov_event = { path = "../cellgov_event" }
cellgov_mem = { path = "../cellgov_mem" }
cellgov_ps3_abi = { path = "../cellgov_ps3_abi" }
cellgov_sync = { path = "../cellgov_sync" }
cellgov_time = { path = "../cellgov_time" }
thiserror = "2"
num_enum = "0.7"
# EnumDiscriminants on Lv2Request: the per-arm fidelity map is an
# exhaustive match over the fieldless discriminant enum, so a new
# request variant cannot ship without declaring its fidelity.
strum = { version = "0.26", default-features = false, features = ["derive"] }
