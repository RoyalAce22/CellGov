[package]
name = "cellgov_fuzz"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Deterministic fuzz-engine library for the PPU and SPU interpreters."

[lints]
workspace = true

[dependencies]
cellgov_effects = { path = "../cellgov_effects" }
cellgov_event = { path = "../cellgov_event" }
cellgov_exec = { path = "../cellgov_exec" }
cellgov_mem = { path = "../cellgov_mem" }
cellgov_ppu = { path = "../cellgov_ppu" }
cellgov_spu = { path = "../cellgov_spu" }
cellgov_sync = { path = "../cellgov_sync" }
cellgov_time = { path = "../cellgov_time" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Scratch directories for the regression-directory tests, removed on drop.
cellgov_testkit = { path = "../cellgov_testkit", features = ["scratch"] }
