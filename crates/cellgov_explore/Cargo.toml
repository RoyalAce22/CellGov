[package]
name = "cellgov_explore"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cellgov_core = { path = "../cellgov_core" }
cellgov_dma = { path = "../cellgov_dma" }
cellgov_effects = { path = "../cellgov_effects" }
cellgov_event = { path = "../cellgov_event" }
cellgov_exec = { path = "../cellgov_exec" }
cellgov_mem = { path = "../cellgov_mem" }
cellgov_sync = { path = "../cellgov_sync" }
cellgov_time = { path = "../cellgov_time" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", default-features = false, features = ["derive"] }

[dev-dependencies]
# The spawn fixture issues `sys_process_spawn` by number, which is the
# ABI crate's to name.
cellgov_ps3_abi = { path = "../cellgov_ps3_abi" }
cellgov_testkit = { path = "../cellgov_testkit" }
