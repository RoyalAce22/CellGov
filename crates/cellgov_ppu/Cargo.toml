[package]
name = "cellgov_ppu"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cellgov_effects = { path = "../cellgov_effects" }
cellgov_event = { path = "../cellgov_event" }
cellgov_exec = { path = "../cellgov_exec" }
cellgov_mem = { path = "../cellgov_mem" }
cellgov_ps3_abi = { path = "../cellgov_ps3_abi" }
cellgov_sync = { path = "../cellgov_sync" }
cellgov_time = { path = "../cellgov_time" }
thiserror = "2"
derive_more = { version = "2", default-features = false, features = ["display"] }
strum = { version = "0.26", default-features = false, features = ["derive"] }

[features]
# Opt-in for the PPU micro-test suite. The suite reads ELFs built by
# tests/micro/*/build.sh (PS3 cross-toolchain, gitignored output); a
# fresh checkout reports the tests as ignored rather than passing
# vacuously, and with the feature on a missing artifact is a hard
# error.
ppu-microtests = []

# Opt-in for the differential spot-check against the RPCS3 source
# checkout under tools/rpcs3-src (gitignored, cloned by the developer).
# RPCS3 is evidence, not authority: a miss is triaged against the ISA
# documents by hand.
rpcs3-src = []

[dev-dependencies]
cellgov_compare = { path = "../cellgov_compare" }
cellgov_core = { path = "../cellgov_core" }
cellgov_spu = { path = "../cellgov_spu" }
cellgov_testkit = { path = "../cellgov_testkit" }
cellgov_trace = { path = "../cellgov_trace" }
criterion.workspace = true
sha1 = "0.10"

[[bench]]
name = "ppu_bench"
harness = false
