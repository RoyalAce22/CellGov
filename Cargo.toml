[workspace]
resolver = "2"
members = [
    "crates/cellgov_ps3_abi",
    "crates/cellgov_time",
    "crates/cellgov_event",
    "crates/cellgov_mem",
    "crates/cellgov_effects",
    "crates/cellgov_sync",
    "crates/cellgov_dma",
    "crates/cellgov_exec",
    "crates/cellgov_trace",
    "crates/cellgov_core",
    "crates/cellgov_compare",
    "crates/cellgov_boot",
    "crates/cellgov_testkit",
    "crates/cellgov_lv2",
    "crates/cellgov_spu",
    "crates/cellgov_ppu",
    "crates/cellgov_explore",
    "crates/cellgov_terminal",
    "apps/cellgov_cli",
    "apps/cellgov_mkelf",
    "apps/cellgov_install",
    "bridges/rpcs3_to_observation",
]
# Default-build excludes the RPCS3 bridge so a plain `cargo build`
# does not pull in any RPCS3-aware code. Build it explicitly with
# `cargo build -p rpcs3_to_observation` when running the
# cross-runner comparison pipeline.
default-members = [
    "crates/cellgov_ps3_abi",
    "crates/cellgov_time",
    "crates/cellgov_event",
    "crates/cellgov_mem",
    "crates/cellgov_effects",
    "crates/cellgov_sync",
    "crates/cellgov_dma",
    "crates/cellgov_exec",
    "crates/cellgov_trace",
    "crates/cellgov_core",
    "crates/cellgov_compare",
    "crates/cellgov_boot",
    "crates/cellgov_testkit",
    "crates/cellgov_lv2",
    "crates/cellgov_spu",
    "crates/cellgov_ppu",
    "crates/cellgov_explore",
    "crates/cellgov_terminal",
    "apps/cellgov_cli",
    "apps/cellgov_mkelf",
    "apps/cellgov_install",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Aidan Bennie / RoyalAce"]
repository = "https://github.com/RoyalAce22/CellGov"
# No crate in this tree is published; the path dependencies between
# them are the whole dependency contract, and deny.toml's wildcard
# check exempts only path dependencies of unpublished crates.
publish = false

[workspace.dependencies]
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
# Forgotten-debugging guardrails. `dbg!` and `todo!()` have no
# legitimate home in main-branch code; `self_named_module_files`
# enforces the workspace's `mod.rs + siblings` module layout.
dbg_macro = "deny"
todo = "deny"
self_named_module_files = "deny"

# Library print discipline. Binary crates opt out at the crate root
# (stdout/stderr are their user-facing channels); host library crates
# annotate intentional one-shot diagnostics with
# `#[allow(..., reason = "...")]` per-site. The runtime crates forbid
# both at the crate root, so no site there can opt out.
print_stdout = "deny"
print_stderr = "deny"

# Panic-discipline floor. Library and binary production paths must
# propagate (`?`), pattern-match, or carry a documented
# `.expect("invariant: ...")`. Test code, benches, and the testkit
# scaffolding crate opt out via crate-root `#![allow]` / `#![cfg_attr]`.
unwrap_used = "deny"

# Type policy. The disallowed list lives in the workspace clippy.toml;
# it names the error-framework types every error type in this tree
# stands in place of, and the hash-ordered collections.
disallowed_types = "deny"

# Host-access policy. The lists live in the workspace clippy.toml and
# bind the runtime crates only: each forbids these lints at its crate
# root outside its test build. Every other crate is a host crate and
# keeps its host access, so the workspace level is allow.
# `disallowed_macros` carries the compile-time half -- `env!`,
# `include_str!` and their kin, which read the build machine.
disallowed_methods = "allow"
disallowed_macros = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"

# The debug gate is only useful if it is short enough to run. At the
# default `opt-level = 0` the interpreter's inner loop costs ~12x what
# it does at 1, which put the external-data suites past 25 minutes and out of
# the habit of being run at all. `1` recovers essentially all of that
# -- a foundation-title boot lands 10-25% off release, against 12x at
# `0` -- and measures no slower to build.
#
# `debug-assertions` and `overflow-checks` stay on -- they are what the
# debug gate exists for, and neither is a measurable share of the cost.
[profile.dev]
opt-level = 1
