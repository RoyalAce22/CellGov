# cargo-nextest profiles. The workflow's blocking test legs and the
# pre-push gate run the workspace tests through `ci` (debug) and
# `ci-release`, and the workflow's microtests job runs `ci-microtests`;
# the operator's data-feature run is `ci-data`. See .github/ci.sh. The
# pre-push gate's `local` group uses plain `cargo test`, which runs a
# binary's tests as threads of one process, so a race over
# process-global state stays visible there.
#
# Each profile writes its JUnit report to its own
# target/nextest/<profile>/ directory.

[profile.ci]
# A retry turns an intermittent failure green and hides its cause.
retries = 0
# Report every failing test in the run, not only the first.
fail-fast = false
# The per-test budget is 10 s. A test still running at 10 s is reported
# SLOW, and at 20 s it is killed and fails by name, well inside the job's
# timeout. The second period absorbs runner-to-runner variance.
slow-timeout = { period = "10s", terminate-after = 2 }
# Print failures and SLOW markers as they happen, and list both again
# after the Summary line; a passing test prints nothing. The Summary
# still counts passed, slow and skipped tests, and the JUnit report
# still records every test's duration.
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

[profile.ci-release]
retries = 0
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 2 }
status-level = "slow"
final-status-level = "slow"

[profile.ci-release.junit]
path = "junit.xml"

# The CLI help walks start the `cellgov` binary once for each command
# path. Run alone, each walk takes 1.2-1.5 s in the debug build. On a
# loaded host the start-ups slow down together: walks that started the
# binary twice for each leaf took 3 s alone and were killed at 20.5 s.
# The help walks get SLOW at 20 s and a kill at 60 s.

[[profile.ci.overrides]]
filter = 'binary_id(cellgov_cli::it) & test(/^cli_reference::/)'
slow-timeout = { period = "20s", terminate-after = 3 }

[[profile.ci-release.overrides]]
filter = 'binary_id(cellgov_cli::it) & test(/^cli_reference::/)'
slow-timeout = { period = "20s", terminate-after = 3 }

# The microtests job (.github/ci.sh microtests).
[profile.ci-microtests]
retries = 0
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 2 }
status-level = "slow"
final-status-level = "slow"

[profile.ci-microtests.junit]
path = "junit.xml"

# The operator's data-feature run (.github/ci.sh data). A test is
# reported SLOW at 10 s and never killed: a title boot or a firmware
# pipeline legitimately takes minutes, and the record keeps its time.
[profile.ci-data]
retries = 0
fail-fast = false
slow-timeout = { period = "10s" }
status-level = "slow"
final-status-level = "slow"

[profile.ci-data.junit]
path = "junit.xml"

# The CLI boot suite's table walks each boot every microtest one or more
# times, as many boots at a time as the host's free memory allows. Each
# walk sizes that count to the whole host, so every test in the suite
# takes every test thread and runs with no other test beside it. The
# suite's other tests take under a second each.
#
# A walk's time grows with its boots and with the microtest count, so the
# walks get a budget of their own: SLOW at 40 s, killed at 120 s. Run
# alone, the walk that boots each microtest seven times took 48 s in a
# 4-CPU Linux container, and the two-boot walk 12 s there against 7.5 s
# on the GitHub runner.

[[profile.ci-microtests.overrides]]
filter = 'binary_id(cellgov_cli::microtests)'
threads-required = "num-test-threads"
slow-timeout = { period = "40s", terminate-after = 3 }

[[profile.ci-data.overrides]]
filter = 'binary_id(cellgov_cli::microtests)'
threads-required = "num-test-threads"
