# cargo-nextest profiles. The workflow's blocking test legs run the
# workspace tests through `ci` (debug) and `ci-release`, and its
# microtests job runs `ci-microtests`; the operator's data-feature run
# is `ci-data`. See .github/ci.sh. Local runs and the pre-push gate use
# plain `cargo test`, which runs a binary's tests as threads of one
# process, so a race over process-global state stays visible there.
#
# Each profile writes its JUnit report to its own
# target/nextest/<profile>/ directory.

[profile.ci]
# A retry turns an intermittent failure green and hides its cause.
retries = 0
# Report every failing test in the run, not only the first.
fail-fast = false
# The per-test budget is 10 s. A test still running at 10 s is reported
# SLOW, and at 20 s it is killed and fails by name, well inside the job's
# timeout. The second period absorbs runner-to-runner variance.
slow-timeout = { period = "10s", terminate-after = 2 }
# Print failures and SLOW markers as they happen, and list both again
# after the Summary line; a passing test prints nothing. The Summary
# still counts passed, slow and skipped tests, and the JUnit report
# still records every test's duration.
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

[profile.ci-release]
retries = 0
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 2 }
status-level = "slow"
final-status-level = "slow"

[profile.ci-release.junit]
path = "junit.xml"

# The microtests job (.github/ci.sh microtests).
[profile.ci-microtests]
retries = 0
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 2 }
status-level = "slow"
final-status-level = "slow"

[profile.ci-microtests.junit]
path = "junit.xml"

# The operator's data-feature run (.github/ci.sh data). A test is
# reported SLOW at 10 s and never killed: a title boot or a firmware
# pipeline legitimately takes minutes, and the record keeps its time.
[profile.ci-data]
retries = 0
fail-fast = false
slow-timeout = { period = "10s" }
status-level = "slow"
final-status-level = "slow"

[profile.ci-data.junit]
path = "junit.xml"

# The CLI boot suite's three table walks each boot their cases as many at
# a time as the host's free memory allows. Each sizes that count to the
# whole host, so each takes every test thread and runs with no other test
# beside it.

[[profile.ci-microtests.overrides]]
filter = 'binary_id(cellgov_cli::microtests) & test(/^(tests::every_microtest_(reports_its_documented_payload|boots_bit_identically_twice)|hardware_match_tests::every_microtest_matches_its_hardware_capture)$/)'
threads-required = "num-test-threads"

[[profile.ci-data.overrides]]
filter = 'binary_id(cellgov_cli::microtests) & test(/^(tests::every_microtest_(reports_its_documented_payload|boots_bit_identically_twice)|hardware_match_tests::every_microtest_matches_its_hardware_capture)$/)'
threads-required = "num-test-threads"
