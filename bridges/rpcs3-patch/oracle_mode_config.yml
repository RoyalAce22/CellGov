# CellGov reference-mode required RPCS3 settings.
#
# Host audio and host rendering introduce divergence that per-step
# tracing cannot reconstruct. Captures made with them enabled cannot be
# compared. The bridge hashes the block below and refuses any dump
# whose supplied hash disagrees.
#
# RPCS3's build revision stays out of the hash. The dump header records
# it, and the bridge accepts any build that passes the cross-runner
# regression tests. A build that changes comparison-relevant semantics
# changes the config shape, which changes the hash and forces an
# explicit update here.
#
# The bridge hashes exactly the lines between the two markers. Editing
# anything inside them changes the expected hash; run
# `rpcs3_to_observation --print-expected-config-hash` to read the new
# value.

# --- BEGIN HASHED ---
Video:
  Renderer: "Null"
Audio:
  Renderer: "Null"
# --- END HASHED ---

# Outside the hash. The decoder is the axis a capture set varies: each
# scenario is recorded once per decoder so two independent answers can
# be checked against each other. Hashing it would make one of the two
# variants unreproducible.
#
# Set one pair in RPCS3, then pass the matching name to the bridge as
# `--decoder <name>`; the flag is required. The bridge writes it to
# `metadata.runner` as `rpcs3-<name>`. An output filename ending
# `_<name>.json` must name that same decoder -- the two-per-scenario
# tree under tests/scenario_observations/ is named that way. A name
# claiming no decoder, such as the per-title
# tests/fixtures/<id>/rpcs3/observation.json, is accepted.
Decoders:
  interpreter:
    PPU Decoder: "Interpreter (static)"
    SPU Decoder: "Interpreter (static)"
  llvm:
    PPU Decoder: "Recompiler (LLVM)"
    SPU Decoder: "Recompiler (LLVM)"
