[package]
name = "rpcs3_to_observation"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cellgov_compare = { path = "../../crates/cellgov_compare" }
cellgov_ps3_abi = { path = "../../crates/cellgov_ps3_abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"

[dev-dependencies]
cellgov_testkit = { path = "../../crates/cellgov_testkit", features = ["scratch"] }
cellgov_trace = { path = "../../crates/cellgov_trace" }
